<template id="tpl-en"><div class="wrap">
  <span class="lbl">Thermodynamics · topic 6, the second law · exercise 18</span>
  <h1>Two gases, and a wall that is freed or removed</h1>
  <p class="sub">The statement's two processes, computed: the wall slides and conducts until the pressures and temperatures agree, or it is drawn out and the gases spread into each other. With the same gas on both sides, the second has nothing to show.</p>

  <div class="box">
    <span class="lbl" style="color:var(--blue)">Statement</span>
    <p>Two compartments of <b>$10\ \mathrm{L}$ and $15\ \mathrm{L}$</b> are separated by a <b>fixed, adiabatic and impermeable</b> wall. In the first we put <b>O₂</b> at <b>$288\ \mathrm{K}$ and $2\ \mathrm{atm}$</b>; in the second, <b>N₂</b> at <b>$300\ \mathrm{K}$ and $1\ \mathrm{atm}$</b>. Both are taken as diatomic ideal gases ($c_v = 5R/2$).</p>
    <ol>
      <li>The separating wall is made <b>diathermal and movable</b>. Obtain the entropy change of the whole system.</li>
      <li>Starting from the initial conditions, the separating wall is <b>suddenly removed</b>. Obtain the entropy change of the whole system.</li>
      <li>If the gases in the two compartments were the same, how would the previous results change?</li>
    </ol>
  </div>
  <details class="orig"><summary>Original (Basque)</summary>
    <p>10 eta 15 l-ko gordailuak finkoa, adiabatikoa eta iragaztezina den hormak banandu ditu. Lehenengo gunean O₂ gasa sartu dugu: $288\ \mathrm{K}$-ean eta $2\ \mathrm{atm}$-n. Bigarrenean, N₂ gasa; kasu honetan, $300\ \mathrm{K}$-ean eta $1\ \mathrm{atm}$-n. Biak gas ideal diatomikotzat hartuko ditugu ($c_v = 5R/2$). 1. Diatermano eta higikor bihurtu dugu bereizte-horma. Lortu sistema osoari dagokion entropia-aldaketa. 2. Hasierako baldintzetatik abiatuz, bereizte-horma bat-batean kendu dugu. Lortu sistema osoari dagokion entropia-aldaketa. 3. Gordailuetako gasak berdinak izanik, nola aldatuko lirateke aurreko emaitzak?</p>
  </details>

  <p class="lede">The vessel is rigid and adiabatic, so whatever happens inside, the two gases keep their energy: both processes end at $T_\mathrm{f} = 293.0\ \mathrm{K}$ and $p_\mathrm{f} = 1.40\ \mathrm{atm}$. What differs is where each gas ends up. Freed, the wall gives O₂ <b>$14.53\ \mathrm{L}$</b> and N₂ <b>$10.47\ \mathrm{L}$</b>, and the entropy rises by <b>$0.81\ \mathrm{J\,K^{-1}}$</b>. Removed, it lets each gas have all <b>$25\ \mathrm{L}$</b>: <b>$9.04\ \mathrm{J\,K^{-1}}$</b>, of which <b>$8.23\ \mathrm{J\,K^{-1}}$</b> is the entropy of mixing. Nothing outside changes, so these are entropy changes of the universe, generated entirely inside the vessel.</p>

  <div class="panels">
    <section class="panel" aria-labelledby="h-app">
      <h2 id="h-app">The apparatus</h2>
      <p class="cap">A rigid, insulated vessel, $0.5\ \mathrm{m}$ long, with the wall between the two gases. Below it, the temperature along the vessel and the entropy as it is generated.</p>
      <svg id="app" viewBox="0 0 680 500" role="img" aria-label="A horizontal insulated vessel divided by a wall: oxygen on the left, nitrogen on the right; a temperature strip and an entropy chart below">
        <defs>
          <pattern id="ins" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="7" height="7" fill="var(--tint)"/>
            <line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink-faint)" stroke-opacity="0.45" stroke-width="1.4"/>
          </pattern>
          <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--heat)"/>
          </marker>
          <clipPath id="inside"><rect x="40" y="96" width="600" height="140"/></clipPath>
        </defs>
        <!-- insulation and the slot the wall leaves through -->
        <rect x="28" y="84" width="624" height="164" fill="url(#ins)" stroke="var(--ink-faint)" stroke-opacity="0.6" stroke-width="1"/>
        <rect x="40" y="96" width="600" height="140" fill="var(--paper)"/>
        <text x="30" y="76" style="font-size:11.5px;fill:var(--ink-faint)">rigid, adiabatic · 25 L</text>
        <!-- the gases -->
        <g clip-path="url(#inside)">
          <rect id="gasA" x="40" y="96" width="240" height="140" fill="var(--o2-fill)"/>
          <rect id="gasB" x="280" y="96" width="360" height="140" fill="var(--n2-fill)"/>
          <g id="cells" style="display:none"></g>
        </g>
        <!-- the wall and its lock -->
        <g id="wall">
          <rect id="wallRect" x="-7" y="96" width="14" height="140" fill="var(--metal)"/>
          <rect id="lockT" x="-4" y="84" width="8" height="10" fill="var(--heat)"/>
          <rect id="lockB" x="-4" y="238" width="8" height="10" fill="var(--heat)"/>
          <g id="cond" opacity="0">
            <path d="M-18,150 L18,150" fill="none" stroke="var(--heat)" stroke-width="2" marker-end="url(#ah)"/>
            <path d="M-18,182 L18,182" fill="none" stroke="var(--heat)" stroke-width="2" marker-end="url(#ah)"/>
          </g>
        </g>
        <rect id="slot" x="268" y="80" width="24" height="6" fill="var(--paper)" stroke="var(--ink-faint)" stroke-opacity="0.6" stroke-width="1" style="display:none"/>
        <!-- labels inside -->
        <text id="lblA" x="52" y="118" style="font-size:13px;font-weight:600;fill:var(--o2)">O₂</text>
        <text id="lblB" x="628" y="118" text-anchor="end" style="font-size:13px;font-weight:600;fill:var(--n2)">N₂</text>
        <text id="stA" x="52" y="222" class="mono" style="font-size:11.5px;fill:var(--ink)">10.0 L · 288 K · 2.00 atm</text>
        <text id="stB" x="628" y="222" text-anchor="end" class="mono" style="font-size:11.5px;fill:var(--ink)">15.0 L · 300 K · 1.00 atm</text>
        <text id="lockLbl" x="280" y="266" text-anchor="middle" style="font-size:11.5px;fill:var(--heat)">locked, adiabatic</text>
        <!-- temperature strip -->
        <g id="tstrip">
          <text x="40" y="288" style="font-size:11.5px;fill:var(--ink-faint);letter-spacing:.06em">T ALONG THE VESSEL</text>
          <rect x="40" y="293" width="600" height="10" fill="none" stroke="var(--line)"/>
          <g id="tcells"></g>
          <text x="40" y="316" class="mono" style="font-size:11px;fill:var(--ink-faint)">260 K</text>
          <text x="640" y="316" text-anchor="end" class="mono" style="font-size:11px;fill:var(--ink-faint)">340 K</text>
        </g>
        <!-- readouts -->
        <g class="mono" style="font-size:13px">
          <text x="40" y="344" style="fill:var(--ink-faint);font-family:var(--sans);font-size:11.5px;letter-spacing:.08em">NOW</text>

        </g>
        <!-- entropy chart -->
        <g id="schart" transform="translate(430,330)">
          <text x="0" y="-6" style="font-size:11.5px;fill:var(--ink-faint);letter-spacing:.06em">ENTROPY GENERATED · J/K</text>
          <line x1="0" y1="110" x2="210" y2="110" stroke="var(--ink-soft)"/>
          <line x1="0" y1="0" x2="0" y2="110" stroke="var(--ink-soft)"/>
          <line id="sTarget" x1="0" y1="20" x2="210" y2="20" stroke="var(--heat)" stroke-dasharray="4 4" opacity="0"/>
          <text id="sTargetLbl" x="210" y="16" text-anchor="end" style="font-size:11px;fill:var(--heat)" opacity="0"></text>
          <path id="sPath" fill="none" stroke="var(--heat)" stroke-width="2"/>
          <circle id="sDot" r="3.5" fill="var(--heat)" opacity="0"/>
          <text id="sY" x="-4" y="4" text-anchor="end" class="mono" style="font-size:10.5px;fill:var(--ink-faint)"></text>
          <text x="-4" y="113" text-anchor="end" class="mono" style="font-size:10.5px;fill:var(--ink-faint)">0</text>
          <text id="sX0" x="0" y="124" class="mono" style="font-size:10.5px;fill:var(--ink-faint)"></text>
          <text id="sX1" x="210" y="124" text-anchor="end" class="mono" style="font-size:10.5px;fill:var(--ink-faint)"></text>
        </g>
      </svg>
    </section>

    <section class="panel" aria-labelledby="h-pv">
      <h2 id="h-pv">The states: p–V plane, one point per gas</h2>
      <p class="cap">Equilibrium states only. Neither process has any between i and f; a reversible route is drawn for each gas, an isochore and then the final isotherm.</p>
      <svg id="pv" viewBox="0 0 520 440" role="img" aria-label="Pressure against volume for each gas: initial states, final states of the two cases, dotted irreversible processes and continuous reversible routes">
        <g id="pvAxes"></g>
        <g id="pvIso"></g>
        <g id="pvRev"></g>
        <g id="pvDot"></g>
        <g id="pvPts"></g>
        <circle id="mA" r="5.5" fill="var(--o2)" stroke="var(--paper)" stroke-width="2" opacity="0"/>
        <circle id="mB" r="5.5" fill="var(--n2)" stroke="var(--paper)" stroke-width="2" opacity="0"/>
        <text id="pvNote" x="500" y="30" text-anchor="end" style="font-size:12px;fill:var(--ink-faint);font-style:italic"></text>
      </svg>
      <div class="legend">
        <span><i class="sw box-o2"></i>O₂, $0.846\ \mathrm{mol}$</span>
        <span><i class="sw box-n2"></i>N₂, $0.609\ \mathrm{mol}$</span>
        <span><i class="sw dot"></i>irreversible, i → f</span>
        <span><i class="sw"></i>a reversible route: isochore, then the $293\ \mathrm{K}$ isotherm</span>
        <span><i class="sw tgrad"></i>temperature, $260\ \mathrm{K}$ to $340\ \mathrm{K}$</span>
        <span><i class="sw" style="opacity:.35"></i>faint: the isotherms (initial temperature continuous, final dashed)</span>

  </div>

  <div class="ledger-head">

  <div id="ledgerBody">
    <div class="ledger-wrap">
      <table aria-label="Entropy change of each gas and of the whole system in the two cases">
        <thead><tr><th></th><th class="p1">1 · wall freed</th><th class="p2">2 · wall removed</th></tr></thead>

      <li>Process 1 is computed, not drawn by hand. The wall ($40\ \mathrm{kg}$, a $10\ \mathrm{cm}$ steel plate of that section) slides without friction against the vessel; each gas is treated as having one pressure and one temperature at a time. The gas drags the wall with $500\ \mathrm{N\,s\,m^{-1}}$, and that drag's heat goes to the two gases, half each: this is where the mechanical irreversibility lives. Heat crosses the wall at $12\ \mathrm{W\,K^{-1}}$: heat across a finite temperature difference, the thermal irreversibility. Energy is conserved exactly by construction. The wall swings about six times in the first $0.6\ \mathrm{s}$, then drifts for a few seconds as heat flows from the nitrogen to the oxygen.</li>

  <p class="sub">Enuntziatuko bi prozesuak, kalkulatuta: hormak irristatu eta beroa eroaten du presioak eta tenperaturak berdindu arte, edo atera egiten da eta gasak batak bestearengan hedatzen dira. Gas bera bi aldeetan dagoela, bigarrenak ez du ezer erakusteko.</p>

        nameB() + ": V = " + f2(VBf * 1e3) + " L · T = " + f1(Tf) + " K · p = " + f2(pf / ATM) + " atm", "ΔS = " + sgn(target, 3) + " J/K",
        "Geldirik: presio berdinak, tenperatura berdinak.", same ? "Sakatu 2 horma kentzeko: ez da ezer gertatuko." : "Sakatu 2 hemendik horma kentzeko: nahastea baino ez.");
      $("b2").disabled = false; put("b2", "2 · Orain kendu horma");
    }
    if (reduce) { end(); return; }
    loop(function (el) {
      var t = Math.min(t1of(el), tTot), k = at(s.t, t);
      var x = s.x[k], TA = s.TA[k], TB = s.TB[k], pA = s.pA[k], pB = s.pB[k], VA = AS * x;
      drawSplit(x, TA, TB, true, false, Math.abs(TA - TB) > 0.3);
      attr("lockLbl", "x", X0 + PXM * x);
      stateText(VA, TA, pA, V - VA, TB, pB);
      markers(VA, pA, V - VA, pB, true);
      chartPoint(t / tTot, Sarr[k]);
      var swinging = t < 1.0, note = swinging ? "Horma orekatik harago doa eta kulunkatzen da; gasak moteltzen du." : "Beroa gas beroagotik igarotzen da hormatik; horma lerratu egiten da.";
      readouts("1. prozesua · t = " + f2(t) + " s" + (speed < 1 && swinging ? " (kamera geldoan ×1/10)" : ""),
        nameA() + ": V = " + f2(VA * 1e3) + " L · T = " + f1(TA) + " K · p = " + f2(pA / ATM) + " atm",
        nameB() + ": V = " + f2((V - VA) * 1e3) + " L · T = " + f1(TB) + " K · p = " + f2(pB / ATM) + " atm",
        "ΔS = " + sgn(Sarr[k], 3) + " J/K", note, "Puntuak p–V planoan: ereduaren egoera bateratuak.");
      return t < tTot;
    }, end);
  }

  function run2() {
    if (phase !== "i" && phase !== "f1") return;
    var fromF = phase === "f1";
    phase = "p2"; caseSel = 2; $("b1").disabled = true; $("b2").disabled = true; $("gDiff").disabled = true; $("gSame").disabled = true;
    drawPV();
    var Si = fromF ? sepS(VAf, Tf, VBf, Tf, same) - sepS(VA0, TA0, VB0, TB0, same) : 0, rush = null, xs, TAr, TBr, Srush = Si;
    if (!fromF) {
      rush = wallRun(MI, C2, 0, 1e-6, 10, 0.02, 0.004, 1e9, 0.5);
      xs = Math.round(rush.xEnd / dxc) * dxc; TAr = rush.TAEnd; TBr = rush.TBEnd;
      Srush = sepS(AS * xs, TAr, AS * (L - xs), TBr, same) - sepS(VA0, TA0, VB0, TB0, same);
    } else { xs = Math.round(xf / dxc) * dxc; TAr = Tf; TBr = Tf; }
    var dif = diffuseRun(xs, TAr, TBr, same, 40);
    var target = same ? dS1 : dS2, Send = Srush + dif.S[dif.S.length - 1];
    var D_LIFT = 0.5, D_RUSH = fromF ? 0 : 1.0, D_DIF = 8.0, tRush = rush ? rush.tEnd : 0, rushRate = rush ? tRush / D_RUSH : 0;
    var tot = D_LIFT + D_RUSH + D_DIF;
    chartSetup(target, "ΔS = " + target.toFixed(2) + " J/K", fromF ? "0" : "0 · 10 ms", "2 h");
    $("slot").style.display = ""; attr("slot", "x", X0 + PXM * (fromF ? xf : x0) - 12);
    put("lockLbl", "");
    var xStart = fromF ? xf : x0, TAs = fromF ? Tf : TA0, TBs = fromF ? Tf : TB0;
    function cellsAt(k) { drawCells(dif.a[k], dif.b[k], dif.T[k]); }
    function end() {
      phase = "f2";
      cellsAt(dif.a.length - 1);
      var fA = same ? [VAf, pf] : [V, nA * R * Tf / V], fB = same ? [VBf, pf] : [V, nB * R * Tf / V];
      markers(fA[0], fA[1], fB[0], fB[1], !same);
      stateText(fA[0], Tf, fA[1], fB[0], Tf, fB[1]); attr("lblA", "x", 52); attr("lblB", "x", 628);
      chartPoint(1, Send);
      readouts("f egoera · 2 h igarota", same ? "gas bat: V = 25.0 L · T = " + f1(Tf) + " K · p = " + f2(pf / ATM) + " atm" : nameA() + ": V = 25.0 L · T = " + f1(Tf) + " K · p = " + f2(fA[1] / ATM) + " atm (partziala)",
        same ? "" : nameB() + ": V = 25.0 L · T = " + f1(Tf) + " K · p = " + f2(fB[1] / ATM) + " atm (partziala)",
        "ΔS = " + sgn(Send, 3) + " J/K", same ? (fromF ? "Ez da ezer gertatu: entropia ez da mugitu." : "Uniformea: 1. kasuko azken egoera eta entropia berak.") : (fromF ? "Nahastuta. Nahaste-entropia bakarrik: " + f2(Send - Si) + " J/K." : "Nahastuta eta uniformea, gas bakoitza bere presio partzialean."), "Sakatu Berrabiarazi berriro hasteko.");
    }
    if (reduce) { end(); return; }
    loop(function (el) {
      var u = el / tot;
      if (el < D_LIFT) {                                   // the wall is drawn out
        var lift = el / D_LIFT;
        drawSplit(xStart, TAs, TBs, true, false, false); stateText(AS * xStart, TAs, nA * R * TAs / (AS * xStart), V - AS * xStart, TBs, nB * R * TBs / (V - AS * xStart));
        $("wall").setAttribute("transform", "translate(" + (X0 + PXM * xStart) + "," + (-170 * lift) + ")");
        readouts("2. prozesua · horma atera egiten da", "", "", "ΔS = " + sgn(Si, 3) + " J/K", fromF ? "Berdindutako egoeratik: T eta p berdinak bi aldeetan." : "Ez dago jada gasak bereizita eusten dituen ezer.");
        chartPoint(u, Si);
      } else if (el < D_LIFT + D_RUSH) {                   // the rush, in slow motion
        var t = (el - D_LIFT) * rushRate, k = at(rush.t, t), x = rush.x[k], TA = rush.TA[k], TB = rush.TB[k], pA = rush.pA[k], pB = rush.pB[k];
        drawSplit(x, TA, TB, false, false, false); $("wall").setAttribute("transform", "translate(" + (X0 + PXM * x0) + ",-170)");
        stateText(AS * x, TA, pA, V - AS * x, TB, pB); markers(AS * x, pA, V - AS * x, pB, true);
        var Sr = (same ? rush.Ss : rush.S)[k];
        chartPoint(u, Sr);
        readouts("2. prozesua · t = " + (t * 1e3).toFixed(1) + " ms (kamera geldoan ×1/" + Math.round(1 / rushRate * 1) + ")", nameA() + ": T = " + f1(TA) + " K · p = " + f2(pA / ATM) + " atm", nameB() + ": T = " + f1(TB) + " K · p = " + f2(pB / ATM) + " atm",
          "ΔS = " + sgn(Sr, 3) + " J/K", "Presioak milisegundotan berdintzen dira:", "O₂ hedatu eta hoztu egiten da, N₂ konprimitu eta berotu.");
      } else {                                             // interdiffusion, in time-lapse
        var td = (el - D_LIFT - D_RUSH) / D_DIF * T2MAX, kd = at(dif.t, td);
        cellsAt(kd); markers(0, 0, 0, 0, false);
        var Tj = dif.T[kd], Tmin = Infinity, Tmax = -Infinity, aL = 0, j;
        for (j = 0; j < N; j++) { if (Tj[j] < Tmin) Tmin = Tj[j]; if (Tj[j] > Tmax) Tmax = Tj[j]; if (j < N / 2) aL += dif.a[kd][j]; }
        put("stA", ""); put("stB", "");
        var Sd = Srush + dif.S[kd];
        chartPoint(u, Sd);
        readouts("2. prozesua · t = " + (td / 60).toFixed(0) + " min (kamera azkarrean ×" + Math.round(T2MAX / D_DIF) + ")",
          same ? "gas bat, uniformeki hedatzen" : nameA() + " ezkerreko erdian: " + (100 * aL / nA).toFixed(0) + " %",
          "T ontzian zehar: " + f1(Tmin) + " K-etik " + f1(Tmax) + " K-era", "ΔS = " + sgn(Sd, 3) + " J/K",
          same ? "Beroak berdintzen du; gasa ez zen inoiz bi gas izan." : "Gas bakoitza bestearengan difunditzen da; beroak berdintzen du.", "Minutuak segundo bihurtzen dira hemen.");
      }
      return el < tot;
    }, end);
  }

  $("b1").addEventListener("click", run1);
  $("b2").addEventListener("click", run2);
  $("b0").addEventListener("click", atI);
  $("gDiff").addEventListener("click", function () { same = false; ledger(); atI(); });
  $("gSame").addEventListener("click", function () { same = true; ledger(); atI(); });
  function setSpeed(v) {
    speed = v;
    $("sReal").setAttribute("aria-pressed", v === 1 ? "true" : "false");
    $("sSlow").setAttribute("aria-pressed", v === 1 ? "false" : "true");
  }
  $("sReal").addEventListener("click", function () { setSpeed(1); });
  $("sSlow").addEventListener("click", function () { setSpeed(0.1); });

  // ---- the ledger can be hidden ----
  function showLedger(on) {
    $("ledgerBody").hidden = !on; $("ledgerNote").hidden = on;
    put("ledgerBtn", on ? "Ezkutatu" : "Erakutsi");
    $("ledgerBtn").setAttribute("aria-expanded", on ? "true" : "false");
    store("ex18-eu-ledger", on ? "1" : "0");
  }
  $("ledgerBtn").addEventListener("click", function () { showLedger($("ledgerBody").hidden); });
  showLedger(store("ex18-eu-ledger") !== "0");

  svgMath();
  ledger(); atI();
  // the models, reachable from the console and from the node check that compares them with tools/verify.py
  window.ex18 = { wallRun: wallRun, diffuseRun: diffuseRun, sepS: sepS, dS1: dS1, dS2: dS2, Tf: Tf, pf: pf, xf: xf, dxc: dxc,
    setSame: function (v) { same = v; }, params: { MW: MW, C1: C1, K1: K1, MI: MI, C2: C2, DIFF: DIFF, ALPHA: ALPHA, N: N, DT2: DT2, T2MAX: T2MAX } };
})();
}
(function () {
  "use strict";
  function setLang(l) {
    var root = document.getElementById("root");
    root.innerHTML = "";
    root.appendChild(document.getElementById("tpl-" + l).content.cloneNode(true));
    if (window.renderMathInElement) renderMathInElement(root, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });
    glue(root);
    document.documentElement.lang = l;
    document.getElementById("langEN").setAttribute("aria-pressed", l === "en" ? "true" : "false");
    document.getElementById("langEU").setAttribute("aria-pressed", l === "eu" ? "true" : "false");
    try { localStorage.setItem("ex18-lang", l); } catch (e) {}
    (l === "eu" ? runEU : runEN)();
  }
  document.getElementById("langEN").addEventListener("click", function () { setLang("en"); });
  document.getElementById("langEU").addEventListener("click", function () { setLang("eu"); });
  var start = "en";
  try { start = localStorage.getItem("ex18-lang") || "en"; } catch (e) {}
  if (location.hash === "#eu") start = "eu"; else if (location.hash === "#en") start = "en";
  setLang(start === "eu" ? "eu" : "en");
})();
</script>
