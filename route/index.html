<template id="tpl-en"><div class="wrap">
  <span class="lbl">Thermodynamics · topic 6, the second law · exercise 18, the route of the calculation</span>
  <h1>Two gases that do not see each other</h1>
  <p class="sub">The entropy change computed the way it is calculated: each gas expands freely on its own, the two are put in thermal contact, and then they are superposed in one vessel. The gases are material points, drawn with a little size so they can be seen.</p>

  <div class="box">
    <span class="lbl" style="color:var(--blue)">A variant of the statement, with equal amounts</span>
    <p>Two compartments of <b>$10\ \mathrm{L}$ and $15\ \mathrm{L}$</b> are separated by a fixed, adiabatic and impermeable wall. In the first, <b>O₂</b> at <b>$288\ \mathrm{K}$ and $2\ \mathrm{atm}$</b>, that is $n = 0.846\ \mathrm{mol}$; in the second, <b>the same amount of N₂</b> at <b>$300\ \mathrm{K}$</b>, which puts it at <b>$1.39\ \mathrm{atm}$</b>. Both diatomic ideal gases, $c_v = 5R/2$. The wall is removed; obtain the entropy change. Then the same with one gas on both sides.</p>
    <p>The statement proper has $1\ \mathrm{atm}$ of N₂, $0.609\ \mathrm{mol}$; equal amounts make the second step end with equal pressures, so the third step is a pure superposition. The <a href="../">page of the statement</a> runs the wall itself.</p>
  </div>

  <p class="lede">The final state is fixed by the closure: $T_\mathrm{f} = 294\ \mathrm{K}$ and $p_\mathrm{f} = 1.63\ \mathrm{atm}$ in $25\ \mathrm{L}$. The route to its entropy is three steps, each one a change of state whose $\Delta S$ is known: a <b>double free expansion</b>, each gas alone into its $25\ \mathrm{L}$ at its own temperature; <b>thermal contact</b>, each gas at its $25\ \mathrm{L}$, to $294\ \mathrm{K}$; and <b>superposition</b>, the two vessels made one. For two different ideal gases the last step changes nothing, and the mixing entropy was all in the first.</p>

  <div class="panels">
    <section class="panel" aria-labelledby="h-app">
      <h2 id="h-app">The gases, as material points</h2>
      <p class="cap">Two vessels of $25\ \mathrm{L}$, one for each gas; the shaded part is vacuum. The points fly in straight lines and bounce off the walls; they pass through each other.</p>
      <canvas id="cv" width="900" height="560" role="img" aria-label="Two stacked vessels with moving points for the molecules of oxygen and nitrogen"></canvas>
      <div class="legend">
        <span><i class="sw o2"></i>O₂, $0.846\ \mathrm{mol}$</span>
        <span><i class="sw n2"></i>N₂, $0.846\ \mathrm{mol}$</span>
        <span><i class="sw vac"></i>vacuum</span>
        <span id="legSame" hidden><i class="sw dot"></i>one colour; the labels say which is which</span>
      </div>
      <div class="now">
        <span class="k">Now</span>
        <span id="r1" style="grid-column:1 / -1"></span>
        <span class="a" id="r2"></span><span class="b" id="r3"></span>
        <span class="a" id="r4"></span><span class="b" id="r5"></span>
        <span class="s" id="r6" style="grid-column:1 / -1"></span>
        <span class="note" id="r7"></span>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-route">
      <h2 id="h-route">The route, step by step</h2>
      <p class="cap">Each step is a change of state; its entropy change is a state-function formula, not a path integral.</p>
      <ol class="steps" id="steps">
        <li id="st1"><span class="t">1 · Double free expansion</span><span class="f">Each gas alone, into vacuum, to $25\ \mathrm{L}$. Ideal, so $T$ does not change: $\Delta S = nR\ln(V/V_\mathrm{i})$ for each.</span><span class="v" id="sv1"></span></li>
        <li id="st2"><span class="t">2 · Thermal contact</span><span class="f">Each gas at its $25\ \mathrm{L}$; heat crosses the shared wall until both are at $T_\mathrm{f}$: $\Delta S = n c_v \ln(T_\mathrm{f}/T_\mathrm{i})$ for each.</span><span class="v" id="sv2"></span></li>
        <li id="st3"><span class="t">3 · Superposition</span><span class="f">The two vessels become one. Each gas still fills $25\ \mathrm{L}$ at $T_\mathrm{f}$; nothing it owns changes.</span><span class="v" id="sv3"></span></li>
      </ol>
      <svg id="chart" viewBox="0 0 520 170" role="img" aria-label="Entropy change accumulated along the three steps">
        <text x="0" y="14" style="font-size:11.5px;fill:var(--ink-faint);letter-spacing:.06em">ENTROPY, ACCUMULATED · J/K</text>
        <g id="bars"></g>
        <line x1="40" y1="140" x2="500" y2="140" stroke="var(--ink-soft)"/>
        <line id="zero" x1="40" y1="140" x2="500" y2="140" stroke="var(--ink-soft)"/>
        <text id="cx1" x="130" y="158" text-anchor="middle" style="font-size:12px">1</text>
        <text id="cx2" x="270" y="158" text-anchor="middle" style="font-size:12px">2</text>
        <text id="cx3" x="410" y="158" text-anchor="middle" style="font-size:12px">3</text>
        <text id="cTot" x="500" y="30" text-anchor="end" style="font-size:13px;fill:var(--heat);font-weight:600"></text>
      </svg>
    </section>
  </div>

  <div class="controls">
    <div>
      <span class="lbl">The gases, and how to see them</span>
      <div class="presets">
        <button class="small" id="gDiff" aria-pressed="true">O₂ and N₂</button>

  <div class="ledger-head">
    <h2>Entropy balance</h2>
    <button class="small" id="ledgerBtn" aria-expanded="true" aria-controls="ledgerBody">Hide</button>
  </div>
  <p class="hidden-note" id="ledgerNote" hidden>Hidden. Show it when the class is ready for the balance.</p>
  <div id="ledgerBody">
    <div class="ledger-wrap">
      <table aria-label="Entropy change of each step for two different gases and for one gas">
        <thead><tr><th></th><th class="p1">O₂ and N₂</th><th class="p2">one gas</th></tr></thead>
        <tbody>
          <tr><td>1 · O₂ free expansion, $10\ \mathrm{L}$ to $25\ \mathrm{L}$</td><td id="l1a"></td><td id="l1as"></td></tr>
          <tr><td>1 · N₂ free expansion, $15\ \mathrm{L}$ to $25\ \mathrm{L}$</td><td id="l1b"></td><td id="l1bs"></td></tr>
          <tr><td>2 · O₂ from $288\ \mathrm{K}$ to $294\ \mathrm{K}$</td><td id="l2a"></td><td id="l2as"></td></tr>
          <tr><td>2 · N₂ from $300\ \mathrm{K}$ to $294\ \mathrm{K}$</td><td id="l2b"></td><td id="l2bs"></td></tr>
          <tr><td>3 · Superposition</td><td id="l3"></td><td id="l3s"></td></tr>
          <tr class="univ"><td>$\Delta S$ of the system, which is isolated</td><td id="lt"></td><td id="lts"></td></tr>
          <tr><td>The wall freed instead of removed, for comparison</td><td id="lw"></td><td id="lws"></td></tr>
        </tbody>
      </table>
    </div>
    <p class="verdict" id="verdict"></p>
  </div>

  <div class="notes">
    <h3>The model behind the drawing</h3>
    <ul>
      <li>The variant keeps the statement's volumes and temperatures and gives the nitrogen the oxygen's amount, $n = 0.846\ \mathrm{mol}$, so its pressure is $1.39\ \mathrm{atm}$ instead of $1\ \mathrm{atm}$. Then $T_\mathrm{f} = 294\ \mathrm{K}$, the plain mean, and after step 2 both gases are at $25\ \mathrm{L}$, $294\ \mathrm{K}$ and $0.816\ \mathrm{atm}$: equal states, so step 3 is a superposition and nothing else. With the statement's amounts the pressures after step 2 differ (0.81 and $0.59\ \mathrm{atm}$); the route is the same, and this page's model takes those amounts too.</li>
      <li>The points are an ideal gas's molecules as material points: they move in straight lines, bounce off the walls elastically and never collide with each other. Each gas starts with speeds drawn from the Maxwell distribution at its temperature (in two dimensions), with the molar masses 32 and 28; 120 points stand for each $0.846\ \mathrm{mol}$. The temperature read out is the kinetic one, from the mean of $v^2$ over the points, so it fluctuates a little.</li>
      <li>Step 1: the partition of each vessel is lifted and the points stream into the vacuum. No collisions, no walls that move: no speed changes, so $T$ stays, exactly as the first law says for a free expansion of an ideal gas.</li>
      <li>Step 2: the vessels are brought together and the wall between them is made diathermal. A point that hits it leaves it with a speed drawn at the wall's temperature, which is kept at $T_\mathrm{f}$, the temperature the two gases must share; the oxygen warms and the nitrogen cools until both read $294\ \mathrm{K}$. The energy the wall hands to one gas it takes from the other on average. With 600 points the mean of $v^2$ would wander by a few per cent from one sample to the next, so each gas's speeds are rescaled to the expectation of the process, $T_\mathrm{i} + (T_\mathrm{f} - T_\mathrm{i})\times$ the fraction of its points the wall has re-emitted; the shape of the distribution is the wall's.</li>
      <li>Step 3: the wall is removed and the lower vessel slides up until the two coincide. The points do not react: an ideal gas does not see the other. For two different gases $\Delta S_3 = 0$, and the mixing entropy is the first step's $\sum nR\ln(V/V_\mathrm{i})$.</li>
      <li>One gas on both sides: the picture with one colour is the same, but the count is not. Two portions of one gas that "each fill $25\ \mathrm{L}$" are, once superposed, one gas of $2n$ moles in $25\ \mathrm{L}$, and the entropy of that state is less than the sum of the two portions' by $-\sum n_i R\ln x_i = 2nR\ln 2 = 9.75\ \mathrm{J\,K^{-1}}$ (Gibbs). Step 3 then carries that correction, and the total is the freed-wall value, $0.29\ \mathrm{J\,K^{-1}}$. Equivalently, for one gas the honest step 1 expands each portion only to its share, $12.5\ \mathrm{L}$, and step 3 is the removal of a wall between equal states, with $\Delta S = 0$.</li>
    </ul>
  </div>
</div>

<template id="tpl-eu"><div class="wrap">
  <span class="lbl">Termodinamika · 6. gaia, bigarren printzipioa · 18. ariketa, kalkuluaren bidea</span>
  <h1>Elkar ikusten ez duten bi gas</h1>
  <p class="sub">Entropia-aldaketa kalkulatzen den moduan kalkulatuta: gas bakoitza bere kabuz hedatzen da askeki, biak kontaktu termikoan jartzen dira, eta gero ontzi batean gainjartzen dira. Gasak puntu materialak dira, tamaina pixka batekin marraztuak, ikus daitezen.</p>

  <div class="box">
    <span class="lbl" style="color:var(--blue)">Enuntziatuaren aldaera bat, kantitate berdinekin</span>
    <p><b>$10\ \mathrm{L}$ eta $15\ \mathrm{L}$</b>-ko bi gune finkoa, adiabatikoa eta iragaztezina den horma batek banandu ditu. Lehenengoan, <b>O₂</b> <b>$288\ \mathrm{K}$-ean eta $2\ \mathrm{atm}$-n</b>, hau da, $n = 0.846\ \mathrm{mol}$; bigarrenean, <b>N₂-kantitate bera</b> <b>$300\ \mathrm{K}$-ean</b>, eta horrek <b>$1.39\ \mathrm{atm}$</b>-n jartzen du. Biak gas ideal diatomikoak, $c_v = 5R/2$. Horma kendu egiten da; lortu entropia-aldaketa. Gero gauza bera, gas bera bi aldeetan dagoela.</p>
    <p>Enuntziatuak berak N₂ $1\ \mathrm{atm}$-n du, $0.609\ \mathrm{mol}$; kantitate berdinekin, bigarren urratsa presio berdinekin amaitzen da, eta, beraz, hirugarren urratsa gainjartze hutsa da. <a href="../">Enuntziatuaren orriak</a> horma bera abiarazten du.</p>
  </div>

  <div class="notes">
    <h3>Marrazkiaren atzeko eredua</h3>
    <ul>
      <li>Aldaerak enuntziatuaren bolumenak eta tenperaturak gordetzen ditu, eta nitrogenoari oxigenoaren kantitatea ematen dio, $n = 0.846\ \mathrm{mol}$; beraz, haren presioa $1.39\ \mathrm{atm}$ da, $1\ \mathrm{atm}$ izan beharrean. Orduan $T_\mathrm{f} = 294\ \mathrm{K}$, batezbesteko arrunta, eta 2. urratsaren ondoren bi gasak $25\ \mathrm{L}$, $294\ \mathrm{K}$ eta $0.816\ \mathrm{atm}$-n daude: egoera berdinak; beraz, 3. urratsa gainjartze bat da, eta besterik ez. Enuntziatuaren kantitateekin, 2. urratsaren ondorengo presioak desberdinak dira (0.81 eta $0.59\ \mathrm{atm}$); bidea bera da, eta orri honetako ereduak kantitate horiek ere onartzen ditu.</li>
      <li>Puntuak gas ideal baten molekulak dira, puntu material gisa: lerro zuzenean higitzen dira, hormetan elastikoki errebotatzen dute eta ez dute inoiz elkar jotzen. Gas bakoitza bere tenperaturako Maxwellen banaketatik (bi dimentsiotan) ateratako abiadurekin hasten da, 32 eta 28 masa molarrekin; 120 puntuk ordezkatzen dute $0.846\ \mathrm{mol}$ bakoitza. Irakurtzen den tenperatura zinetikoa da, puntuen $v^2$-ren batezbestekotik; beraz, pixka bat fluktuatzen du.</li>
      <li>1. urratsa: ontzi bakoitzaren trenkada altxatzen da eta puntuak hutsera isurtzen dira. Talkarik ez, higitzen den hormarik ez: abiadurak ez dira aldatzen; beraz, $T$ mantendu egiten da, lehen printzipioak gas ideal baten hedapen askerako dioen bezalaxe.</li>
      <li>2. urratsa: ontziak elkarrengana hurbiltzen dira eta bien arteko horma diatermano bihurtzen da. Horma jotzen duen puntu batek hormaren tenperaturan ateratako abiadura batekin uzten du hura; tenperatura hori $T_\mathrm{f}$-n mantentzen da, bi gasek partekatu behar duten tenperaturan; oxigenoa berotu eta nitrogenoa hoztu egiten da, biek $294\ \mathrm{K}$ irakurri arte. Hormak gas bati ematen dion energia besteari kentzen dio, batez beste. 600 punturekin $v^2$-ren batezbestekoa ehuneko batzuk aldatuko litzateke lagin batetik hurrengora; beraz, gas bakoitzaren abiadurak prozesuaren itxaropenera birreskalatzen dira, $T_\mathrm{i} + (T_\mathrm{f} - T_\mathrm{i})\times$ hormak berriro igorri dituen puntuen frakzioa; banaketaren forma hormarena da.</li>
      <li>3. urratsa: horma kendu egiten da eta beheko ontzia gora irristatzen da, biak bat etorri arte. Puntuek ez dute erreakzionatzen: gas ideal batek ez du bestea ikusten. Bi gas desberdinentzat $\Delta S_3 = 0$, eta nahaste-entropia lehen urratseko $\sum nR\ln(V/V_\mathrm{i})$ da.</li>
      <li>Gas bera bi aldeetan: kolore bakarreko irudia bera da, baina kontua ez. "Bakoitzak $25\ \mathrm{L}$ betetzen dituen" gas baten bi zati, behin gainjarrita, $2n$ moleko gas bakarra dira $25\ \mathrm{L}$-etan, eta egoera horren entropia bi zatien baturarena baino txikiagoa da, $-\sum n_i R\ln x_i = 2nR\ln 2 = 9.75\ \mathrm{J\,K^{-1}}$ gutxiago (Gibbs). 3. urratsak zuzenketa hori dakar orduan, eta totala horma askatuaren balioa da, $0.29\ \mathrm{J\,K^{-1}}$. Baliokideki, gas bakarrarentzat 1. urrats zintzoak zati bakoitza dagokion zatira baino ez du hedatzen, $12.5\ \mathrm{L}$-etara, eta 3. urratsa egoera berdinen arteko horma kentzea da, $\Delta S = 0$ duela.</li>
    </ul>

    [1, 2, 3].forEach(function (k) { $("st" + k).className = done[k - 1] === 1 ? "on" : done[k - 1] === 2 ? "done" : ""; });
    chart();
  }
  function chart() {
    var g = $("bars"); while (g.firstChild) g.removeChild(g.firstChild);
    var vals = [s1a + s1b, s2a + s2b, same ? s3same : 0], acc = 0, top = 11, bot = -11, y0 = 140, sc = 100 / top;
    var NS = "http://www.w3.org/2000/svg";
    for (var k = 0; k < 3; k++) {
      var frac = done[k] === 2 ? 1 : done[k] === 1 ? prog : 0, v = vals[k] * frac, x = 90 + k * 140;
      var y1 = y0 - acc * sc, y2 = y0 - (acc + v) * sc;
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", x); r.setAttribute("width", 80); r.setAttribute("y", Math.min(y1, y2)); r.setAttribute("height", Math.abs(y2 - y1));
      r.setAttribute("fill", v >= 0 ? "var(--heat)" : "var(--blue)"); r.setAttribute("fill-opacity", "0.85"); g.appendChild(r);
      if (k < 2) { var l = document.createElementNS(NS, "line"); l.setAttribute("x1", x + 80); l.setAttribute("x2", x + 140); l.setAttribute("y1", y2); l.setAttribute("y2", y2); l.setAttribute("stroke", "var(--ink-faint)"); l.setAttribute("stroke-dasharray", "3 3"); g.appendChild(l); }
      acc += v;
    }
    put("cTot", "ΔS = " + sgn(acc, 2) + " J/K");
  }
  var prog = 0;

  // ---- ledger ----
  function ledger() {
    html("l1a", sgn(s1a, 3) + " J/K"); html("l1as", sgn(s1a, 3) + " J/K");
    html("l1b", sgn(s1b, 3) + " J/K"); html("l1bs", sgn(s1b, 3) + " J/K");
    html("l2a", sgn(s2a, 3) + " J/K"); html("l2as", sgn(s2a, 3) + " J/K");
    html("l2b", sgn(s2b, 3) + " J/K"); html("l2bs", sgn(s2b, 3) + " J/K");
    html("l3", "0 J/K"); html("l3s", sgn(s3same, 3) + " J/K");
    html("lt", sgn(tot, 3) + " J/K"); html("lts", sgn(totSame, 3) + " J/K");
    html("lw", sgn(wall, 3) + " J/K"); html("lws", sgn(wall, 3) + " J/K");
    html("verdict", same
      ? "Gas bakarrarekin, hiru urratsek <b>" + totSame.toFixed(2) + " J/K</b> ematen dute batuta, horma askatuaren balioa: hedapen aske bikoitzak " + (s1a + s1b).toFixed(2) + " J/K zenbatzen ditu, bi gas 25 L-etan zabaldu balira bezala, eta gainjartzeak " + Math.abs(s3same).toFixed(2) + " J/K kentzen ditu, gas baten bi zati ontzi batean 2n moleko gas bakarra direlako (Gibbs). Puntuek ez dute zuzenketa erakusten; kontuak bai."
      : "O₂-arentzat eta N₂-arentzat bideak <b>" + tot.toFixed(2) + " J/K</b> ematen ditu: " + (s1a + s1b).toFixed(2) + " J/K bi hedapen askeetatik, " + (s2a + s2b).toFixed(2) + " J/K kontaktu termikotik, eta ezer ez gainjartzetik. Nahaste-entropia osoa 1. urratsean dago, gas bakoitza besteak utzitako bolumenean zabaltzen den lekuan. Kendu beharrean askatuta, hormak " + wall.toFixed(2) + " J/K emango lituzke.");
    $("gDiff").setAttribute("aria-pressed", same ? "false" : "true"); $("gSame").setAttribute("aria-pressed", same ? "true" : "false");
    $("vCol").setAttribute("aria-pressed", labels ? "false" : "true"); $("vLbl").setAttribute("aria-pressed", labels ? "true" : "false");
    $("legSame").hidden = !labels;
  }

  // ---- the stages ----
  function atI() {
    cancelAnimationFrame(raf); raf = 0; last = null;
    part = [W * VA0 / V, W * VB0 / V]; diath = false; offB = 0; stage = 0; done = [0, 0, 0]; prog = 0;
    seed(); draw(); routePanel();
    html("r1", "i egoera · gas bakoitza bere gunean, bere ontziaren gainerakoa hutsik");
    states(VA0, VB0, TA0, TB0); readT();
    html("r6", "ΔS = 0 J/K"); put("r7", "Sakatu 1: trenkadak altxatzen dira.");
    $("b1").disabled = false; $("b2").disabled = true; $("b3").disabled = true;
    $("gDiff").disabled = false; $("gSame").disabled = false;
    run();
  }
  function run() {                           // the points always move; the stages change the walls
    function frame(ts) {
      if (last == null) last = ts;
      var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      if (!reduce) step(dt);
      if (stage === 1) { prog = Math.min(1, prog + dt / 2.5); if (prog >= 1) { done[0] = 2; stage = 0; $("b2").disabled = false; put("r7", "Sakatu 2: ontziak elkarrengana hurbiltzen dira eta bien arteko hormak beroa eroaten du."); routePanel(); } chart(); }
      if (stage === 2) {
        if (offB < GAP) offB = Math.min(GAP, offB + dt * 80); else diath = true;
        prog = Math.min(1, 0.5 * (fracHit(0) + fracHit(1)) / 0.95);
        if (diath && prog >= 1) {
          scaleTo(0, Tf); scaleTo(1, Tf); readT(); done[1] = 2; stage = 0; diath = false; $("b3").disabled = false;
          put("r7", "Biek 294 K irakurtzen dute. Sakatu 3: horma kendu eta ontziak bat bihurtzen dira."); html("r6", "ΔS = " + sgn(s1a + s1b + s2a + s2b, 3) + " J/K"); states(V, V, Tf, Tf); routePanel();
        } else html("r6", "ΔS = " + sgn(s1a + s1b + (s2a + s2b) * prog, 3) + " J/K");
        chart();
      }
      if (stage === 3) {
        if (offB < GAP + H) { offB = Math.min(GAP + H, offB + dt * 80); prog = (offB - GAP) / H; }
        else { prog = 1; done[2] = 2; stage = 4; html("r6", "ΔS = " + sgn(same ? totSame : tot, 3) + " J/K"); put("r7", same ? "Ontzi bat, gas bat: ez dago ezer ikusteko, eta kontua zuzenduta dago. Berrabiarazi berriro egiteko." : "Ontzi bat, elkarri jaramonik egiten ez dioten bi gas: ez da ezer aldatu bientzat. Berrabiarazi berriro egiteko."); routePanel(); }
        chart();
      }
      if (stage === 2) readT();
      draw();
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }
  $("b1").addEventListener("click", function () {
    if (done[0]) return; stage = 1; done[0] = 1; prog = 0; part = [W, W]; $("b1").disabled = true; $("gDiff").disabled = true; $("gSame").disabled = true;
    html("r1", "1. urratsa · hedapen aske bikoitza, gas bakoitza bakarrik"); states(V, V, TA0, TB0); readT(); routePanel();
    html("r6", "ΔS = " + sgn(s1a + s1b, 3) + " J/K"); put("r7", "Hutsera: abiadurak ez dira aldatzen, tenperaturek irauten dute.");
  });
  $("b2").addEventListener("click", function () {
    if (done[1] || !done[0]) return; stage = 2; done[1] = 1; prog = 0; $("b2").disabled = true;
    html("r1", "2. urratsa · kontaktu termikoa horma komunetik"); put("r7", "Horma komuna jotzen duen puntu batek hormaren tenperaturan uzten du hura, 294 K-ean."); routePanel();
  });
  $("b3").addEventListener("click", function () {
    if (done[2] || !done[1]) return; stage = 3; done[2] = 1; prog = 0; $("b3").disabled = true;
    html("r1", "3. urratsa · gainjartzea: ontziak bat eginda"); put("r7", "Puntuek elkar zeharkatzen dute: gas ideal batek ez du bestea ikusten."); routePanel();
  });
  $("b0").addEventListener("click", atI);
  $("gDiff").addEventListener("click", function () { same = false; ledger(); atI(); });
  $("gSame").addEventListener("click", function () { same = true; ledger(); atI(); });
  $("vCol").addEventListener("click", function () { labels = false; ledger(); });
  $("vLbl").addEventListener("click", function () { labels = true; ledger(); });

  // ---- the ledger can be hidden ----
  function showLedger(on) {
    $("ledgerBody").hidden = !on; $("ledgerNote").hidden = on;
    put("ledgerBtn", on ? "Ezkutatu" : "Erakutsi");
    $("ledgerBtn").setAttribute("aria-expanded", on ? "true" : "false");
    store("ex18r-eu-ledger", on ? "1" : "0");
  }
  $("ledgerBtn").addEventListener("click", function () { showLedger($("ledgerBody").hidden); });
  showLedger(store("ex18r-eu-ledger") !== "0");

  svgMath();
  ledger(); atI();
  window.ex18r = { nA: nA, nB: nB, pB0: pB0, Tf: Tf, pf: pf, s1a: s1a, s1b: s1b, s2a: s2a, s2b: s2b, s3same: s3same, tot: tot, totSame: totSame, wall: wall };
})();
}
(function () {
  "use strict";
  function setLang(l) {
    var root = document.getElementById("root");
    root.innerHTML = "";
    root.appendChild(document.getElementById("tpl-" + l).content.cloneNode(true));
    if (window.renderMathInElement) renderMathInElement(root, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });
    glue(root);
    document.documentElement.lang = l;
    document.getElementById("langEN").setAttribute("aria-pressed", l === "en" ? "true" : "false");
    document.getElementById("langEU").setAttribute("aria-pressed", l === "eu" ? "true" : "false");
    try { localStorage.setItem("ex18r-lang", l); } catch (e) {}
    (l === "eu" ? runEU : runEN)();
  }
  document.getElementById("langEN").addEventListener("click", function () { setLang("en"); });
  document.getElementById("langEU").addEventListener("click", function () { setLang("eu"); });
  var start = "en";
  try { start = localStorage.getItem("ex18r-lang") || "en"; } catch (e) {}
  if (location.hash === "#eu") start = "eu"; else if (location.hash === "#en") start = "en";
  setLang(start === "eu" ? "eu" : "en");
})();
</script>
